openapi: "3.1.0"
info:
  title: Partner orders with empty servers
  version: "2.4.0"
  description: The partner order contract, served exactly as written.
servers: []
tags:
  - name: orders
    description: Partner orders
x-partner-extension:
  owner: partner-integrations
  tier: gold
paths:
  /orders:
    get:
      operationId: listOrders
      tags:
        - orders
      description: Lists the partner's orders, one page at a time.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The partner orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags:
        - orders
      description: Creates a partner order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "204":
          description: Created
components:
  schemas:
    Order:
      type: object
      required:
        - sku
      properties:
        sku:
          type: string
        quantity:
          type: integer
    OrderRequest:
      type: object
      required:
        - sku
      properties:
        sku:
          type: string
          pattern: "^[A-Z]{3}-[0-9]{4}$"
        quantity:
          type: integer
          minimum: 1
