---
openapi: "3.1.1"
info:
  title: "Complete entries"
  description: "Every documented feature of one resource set"
  version: "2.1"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
servers:
- url: "/ref"
paths:
  /entries:
    post:
      tags:
      - "write"
      - "entries"
      summary: "Create an entry"
      operationId: "createEntry"
      requestBody:
        description: "The entry to create"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createEntry.request"
        required: true
      responses:
        "201":
          description: "The entry was created"
          headers:
            Location:
              description: "Where the new entry is read"
              schema:
                $ref: "#/components/schemas/createEntry.response.201.header.Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createEntry.response.201"
              examples:
                created:
                  summary: "A created entry"
                  value:
                    id: "e-1"
                    title: "First"
        "400":
          description: "The entry was refused"
      security:
      - bearerAuth: []
      - apiKeyAuth: []
  /entries/exports:
    post:
      tags:
      - "entries"
      description: "Starts an export of every entry"
      operationId: "exportEntries"
      parameters:
      - name: "format"
        in: "query"
        schema:
          type: "string"
      responses:
        default:
          description: "Response determined at runtime"
      deprecated: true
      security:
      - bearerAuth:
        - "entries.export"
  /entries/{entryId}:
    get:
      tags:
      - "public"
      - "read"
      - "entries"
      summary: "Read an entry"
      description: "Returns one entry by its identifier"
      operationId: "getEntry"
      parameters:
      - name: "entryId"
        in: "path"
        description: "The entry identifier"
        required: true
        schema:
          type: "string"
          pattern: "^[a-z0-9-]+$"
      - name: "view"
        in: "query"
        schema:
          type: "string"
      - name: "X-Trace-Id"
        in: "header"
        description: "The caller's trace identifier"
        required: true
        schema:
          type: "string"
        example: "trace-1"
      - name: "session"
        in: "cookie"
        schema:
          type: "string"
      - name: "page"
        in: "query"
        description: "The page to read"
        schema:
          default: "1"
      - name: "X-Page-Size"
        in: "header"
        schema: {}
      - name: "sort"
        in: "query"
        description: "The sort order"
        schema: {}
      - name: "locale"
        in: "cookie"
        schema: {}
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getEntry.response"
      security:
      - bearerAuth:
        - "entries.read"
    delete:
      tags:
      - "entries"
      summary: "Archive an entry"
      operationId: "archiveEntry"
      parameters:
      - name: "entryId"
        in: "path"
        description: "The entry identifier"
        required: true
        schema:
          type: "string"
      responses:
        default:
          description: "Response determined at runtime"
      security:
      - apiKeyAuth: []
components:
  schemas:
    createEntry.request:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      additionalProperties: {}
      patternProperties:
        ^(?!text(?![\s\S]))[tT][eE][xX][tT](?![\s\S]):
          type: "string"
        ^(?!title(?![\s\S]))[tT][iI][tT][lL][eE](?![\s\S]):
          description: "The entry title"
          type: "string"
      properties:
        text:
          type: "string"
        title:
          description: "The entry title"
          type: "string"
      propertyNames:
        allOf:
        - not:
            pattern: "[^\\x00-\\x7F]"
      type: "object"
    createEntry.response.201:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      properties:
        id:
          type: "string"
        title:
          type: "string"
      type: "object"
    createEntry.response.201.header.Location:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: "string"
    getEntry.response:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      properties:
        id:
          type: "string"
        title:
          type: "string"
      type: "object"
  securitySchemes:
    apiKeyAuth:
      type: "apiKey"
      name: "X-Api-Key"
      in: "header"
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
tags:
- name: "entries"
  description: "Entry operations"
  externalDocs:
    url: "https://docs.example.test/entries"
- name: "read"
  description: "Reading operations"
- name: "write"
  description: "Writing operations"
x-vertique-validation:
  patternDialect: "java.util.regex"
