#
# Runs Renovate on a weekly schedule via the self-hosted renovatebot/github-action,
# reading config from renovate.json5 at the repo root. Only ever fires from a
# schedule or a manually triggered workflow_dispatch — never from pull_request or
# any other event that could carry untrusted code — so the App's private key is
# never reachable from a fork or an unreviewed PR.
#
# Authenticates as a dedicated GitHub App installation rather than a personal PAT:
# PRs it opens are attributed to the app's own [bot] identity instead of whoever's
# token was configured, and the minted installation token is short-lived (expires
# in about an hour) instead of a long-lived personal credential. It also still
# triggers other workflows (unlike the default GITHUB_TOKEN), which the required
# CI check on Renovate's own PRs depends on. The default token here stays
# read-only; all mutating calls go through the App's installation token.

name: Renovate

on:
  schedule:
    - cron: '0 4 * * 1' # weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: renovatebot/github-action@37beffda261423addd537c33f2d126df7f6ffbab # v46.2.6
        with:
          configurationFile: renovate.json5
          token: '${{ steps.app-token.outputs.token }}'
        env:
          RENOVATE_REPOSITORIES: '${{ github.repository }}'
          # Temporary: diagnosing a platform-unknown-error from initRepo after
          # switching to GitHub App auth. Drop this once the cause is confirmed
          # fixed.
          LOG_LEVEL: debug
