#
# Mutation testing (advisory) — the PR-scoped PIT pilot.
#
# Mutates only the production classes a pull request adds lines to in the pilot
# modules and lists, in the job summary, the mutants on those lines that no
# unit test detects. Deliberately NOT a required check and not part of ci.yml:
# a slow or flaky advisory run must never touch the required result, and
# undetected mutants never fail this job. A failed PIT run does, visibly.
#
# Read-only and secret-free like required CI. All logic lives in
# scripts/pit-pr-scope.sh, which runs locally with the same semantics.
# Mutants execute with real side effects; this ephemeral, non-root runner is
# the sandbox that makes that acceptable.

name: Mutation (advisory)

# Only pull requests that can produce a result (production Java) or that
# change the tooling itself start a runner.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/src/main/java/**"
      - "scripts/pit-pr-scope.*"
      - ".github/workflows/mutation.yml"
      - "pom.xml"

permissions:
  contents: read

# A newer push to the same pull request supersedes the running analysis.
concurrency:
  group: mutation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mutation:
    name: PR-scoped mutation testing
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      # pull_request checks out the merge commit; its first parent is the base
      # it was merged onto, so HEAD^1..HEAD is exactly this PR's change in the
      # code that PIT mutates. Depth 2 fetches both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # Restore-only: required CI owns saving the Maven cache. PIT's own
      # artifacts are small and resolve from Maven Central when missing.
      - id: pom-hash
        run: bash scripts/compute-maven-cache-key.sh >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ steps.pom-hash.outputs.value }}-${{ github.run_id }}
          restore-keys: |
            maven-${{ runner.os }}-${{ steps.pom-hash.outputs.value }}-
            maven-${{ runner.os }}-

      - name: Mutate changed pilot classes
        run: bash scripts/pit-pr-scope.sh --base HEAD^1

      # Kept on failure too: the HTML report shows every mutant of the changed
      # classes, not only those on added lines.
      - name: Upload mutation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-reports
          path: |
            target/pit-pr/**
            **/target/pit-reports/**
          if-no-files-found: ignore
