#
# RELEASE-001 mutable SNAPSHOT publication
# (FR-REL-020, FR-REL-021, FR-REL-022, FR-REL-023; ADR 0006).
#
# This is the only product-owned workflow that holds a write credential, so the
# conditions under which it runs are the security boundary — and they live in
# release/snapshot-guard.mjs, not in this YAML.
#
# It is bound to the completion of the named required-CI workflow rather than to
# push, so it can only publish bytes that were verified. The payload is built by
# that CI run, not rebuilt here: it is downloaded from the exact triggering run
# and checked for consistency with the commit the guard approved before
# anything is deployed (release/snapshot-payload.mjs). It is deliberately NOT
# a required check and cannot write a CI status: a failed publication must not
# erase the required-CI result that was already established (FR-REL-023).
#
# The token is the repository's own GITHUB_TOKEN with packages:write. There is
# no cross-repository App credential here, and no caller-supplied repository or
# ref — the checkout is pinned to the exact SHA the required-CI run verified.

name: Publish SNAPSHOT

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  # Read access to the triggering CI run's artifacts, nothing more.
  actions: read

# Serialized per repository, and an in-flight deployment is never cancelled:
# a half-written snapshot is worse than a delayed one (FR-REL-022).
concurrency:
  group: snapshot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish main SNAPSHOT
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The exact commit required CI verified — never a moving ref.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      # The guard collects its own context and decides. A denial exits 0: it is
      # a normal outcome, and a red run here would be indistinguishable from a
      # real fault.
      - name: Evaluate publication guard
        id: guard
        run: node release/snapshot-guard.mjs --github-output >> "$GITHUB_OUTPUT"

      # The payload the required-CI run staged for this exact commit. The run id
      # comes from the triggering event, never from a caller-supplied input.
      - name: Download the CI-built payload
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshot-payload
          path: ${{ runner.temp }}/snapshot-payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A consistency check, not authentication: refuses a payload built from
      # another commit, or one with a changed, missing, extra or non-regular
      # file, before any byte is deployed. The version reaches the shell through
      # the environment, never spliced into the command text.
      - name: Verify the payload belongs to the approved commit
        if: steps.guard.outputs.allowed == 'true'
        env:
          PAYLOAD_VERSION: ${{ steps.guard.outputs.version }}
        run: node release/snapshot-payload.mjs verify --dir ${{ runner.temp }}/snapshot-payload --sha ${{ steps.guard.outputs.checkout_sha }} --version "$PAYLOAD_VERSION"

      - name: Publish the derived allowlist
        if: steps.guard.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_VERSION: ${{ steps.guard.outputs.version }}
        run: bash release/publish-artifacts.sh --local-repository ${{ runner.temp }}/snapshot-payload/repository --repository-id github --target-url https://maven.pkg.github.com/${{ github.repository }} --mode snapshot --version "$PAYLOAD_VERSION"
