#
# RELEASE-001 required CI (FR-REL-010, FR-REL-014, FR-REL-023, NFR-REL-001,
# NFR-REL-006).
#
# This is the required check for pull requests and pushes to main. It holds
# read-only permissions and references no secret, so no package, release, tag
# or repository-content write credential is ever available to code arriving
# through a pull request.
#
# Every step binds an event or invokes a versioned, locally runnable
# repository-owned entry point; substantive logic never lives in this YAML.
# SNAPSHOT publication is a separate, non-required workflow so its failure
# cannot erase this workflow's already-established result.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Classifies the changed paths so a docs-only pull request can skip the
  # expensive build (a job skipped via `if:` satisfies its required check).
  # The decision lives in a repository-owned, contract-tested script; pushes
  # to main always build, so SNAPSHOT publication only trails verified SHAs.
  classify:
    name: Classify changed paths
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/detect-docs-only-scope.sh --event-name "$EVENT_NAME" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build and Test
    needs: classify
    # !cancelled(): if classify itself fails, docs_only is empty and the full
    # build still runs — a classify failure must never satisfy the required
    # check by skipping the job it exists to gate.
    if: ${{ !cancelled() && needs.classify.outputs.docs_only != 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history: the diff coverage gate diffs against origin/main.
          fetch-depth: 0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's hashFiles('**/pom.xml') is a live expression that would
      # match target/ files the archetype and invoker integration tests
      # generate mid-build, changing the hash between an early step and a
      # late step of the SAME run. This script hashes only the checked-out
      # source tree, so its output is stable regardless of when it runs.
      - id: pom-hash
        run: bash scripts/compute-maven-cache-key.sh >> "$GITHUB_OUTPUT"

      # setup-java's own "cache: maven" only saves on a cache miss — once a
      # cache exists for the current pom.xml hash it is never refreshed, so
      # any dependency first resolved in a later commit (most commonly a
      # plugin's own transitive, e.g. httpclient/qdox/common-java5) is never
      # persisted and stays permanently exposed to Maven Central on every
      # run. restore/save as separate steps instead: every run's downloads
      # get captured under its own key, so the cache grows toward
      # completeness instead of freezing at whatever existed when it was
      # first created.
      #
      # No separate "stable main key": GitHub's cache restore already
      # retries the full restore-keys chain against the default branch when
      # nothing matches on the current branch, so the broad
      # maven-${{ runner.os }}- fallback below already resolves to main's
      # most recent per-run save for a pull request branch that has none of
      # its own yet. A deliberately-refreshed stable key would need
      # `gh cache delete`, which needs actions: write — forbidden in this
      # job by PublicCiContractTest's pullRequestBuildHasReadOnlyPermissions
      # AndNoSecrets (FR-REL-014, NFR-REL-001): required CI holds read-only
      # permissions, no exceptions.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ steps.pom-hash.outputs.value }}-${{ github.run_id }}
          restore-keys: |
            maven-${{ runner.os }}-${{ steps.pom-hash.outputs.value }}-
            maven-${{ runner.os }}-

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Verify release contracts
        run: node --test release/tests/publication-contract.test.mjs release/tests/coverage-aggregate-contract.test.mjs release/tests/docs-only-scope.test.mjs

      - name: Verify test bind policy
        run: |
          bash scripts/test-verify-test-bind-policy.sh
          bash scripts/verify-test-bind-policy.sh

      - name: Verify test HTTP client policy
        run: |
          bash scripts/test-verify-test-client-policy.sh
          bash scripts/verify-test-client-policy.sh

      # Formatting is a required pre-build gate: fail fast before compiling or
      # running tests when Java sources do not match the repository formatter.
      - name: Check formatting
        run: ./mvnw -ntp -pl '!vertique-app-parent' spotless:check

      # Per-module HTML reports are skipped: the vertique-coverage-report
      # aggregate XML produced by this same invocation is the only coverage
      # output CI consumes. Reactor execution mode comes from
      # .mvn/maven.config so local and CI builds share one setting. The
      # OpenAPI plugin guards swagger-core's shared registry initialization,
      # so unrelated modules remain parallel.
      - name: Build and test
        run: ./mvnw -ntp -Djacoco.module.report.skip=true clean verify

      # Surefire and Failsafe redirect test output to these reports. Retain
      # them after failures and cancellation so CI-only flakes and hangs remain
      # diagnosable after the run.
      - name: Upload test reports after build interruption
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore

      # Gates only the lines this PR changes (threshold = the standing 80%
      # target). No credential, no external service; locally runnable as-is.
      - name: Diff coverage gate
        if: github.event_name == 'pull_request'
        run: bash scripts/diff-coverage-gate.sh

      # Consumed by the non-required Coverage Comment workflow. Uploaded even
      # when the gate fails — a failing gate is exactly when the PR comment
      # matters — and needs no write permission and no secret.
      - name: Upload PR coverage report
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-pr
          path: |
            vertique-coverage-report/target/site/jacoco-aggregate/jacoco.xml
            vertique-coverage-report/target/site/jacoco-aggregate/diff-cover.json
          if-no-files-found: ignore

      # Consumed by the non-required Coverage Trend workflow. Uploading needs
      # no write permission and no secret.
      - name: Upload aggregate coverage report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-aggregate
          path: vertique-coverage-report/target/site/jacoco-aggregate/jacoco.xml
          if-no-files-found: error

      # Always, not just on success: whatever this run downloaded should
      # survive even if a later step (or the build itself) fails, since a
      # failure downstream of dependency resolution shouldn't cost the next
      # run's cache the artifacts this run already fetched. The per-run key
      # never collides, so this never fails on "cache already exists".
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ steps.pom-hash.outputs.value }}-${{ github.run_id }}
