#
# RELEASE-001 required CI (FR-REL-010, FR-REL-014, FR-REL-023, NFR-REL-001,
# NFR-REL-006).
#
# This is the required check for pull requests and pushes to main. It holds
# read-only permissions and references no secret, so no package, release, tag
# or repository-content write credential is ever available to code arriving
# through a pull request.
#
# Every step binds an event or invokes a versioned, locally runnable
# repository-owned entry point; substantive logic never lives in this YAML.
# SNAPSHOT publication is a separate, non-required workflow so its failure
# cannot erase this workflow's already-established result.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Verify release contracts
        run: node --test release/tests/publication-contract.test.mjs

      - name: Verify test bind policy
        run: |
          bash scripts/test-verify-test-bind-policy.sh
          bash scripts/verify-test-bind-policy.sh

      - name: Build and test
        run: ./mvnw -ntp -T 1 clean verify

      - name: Check formatting
        run: ./mvnw -ntp -T 1 -pl '!vertique-app-parent' spotless:check
