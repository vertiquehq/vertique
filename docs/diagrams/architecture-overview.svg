<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 820 692" role="img">
<title>Vertique platform architecture</title>
<desc>A high-level layered platform stack on Vert.x 5.1. Shipped capabilities are solid; prospective additions are dashed (roadmap): MCP inbound tool edge, AI agents in the programming model, LLM clients outbound, and Spring Boot / Quarkus host bridges. Inbound edges: REST, WebSocket, SSE, Kafka, Camel. Request pipeline: security, validation, sanitization, localization. Programming model on the event bus: contract-based services, durable saga/Temporal workflow, cron jobs, delayed jobs, transactional inbox/outbox. An async non-blocking reactive runtime. Outbound edges: REST client, Kafka producers, Camel outbox. Cross-cutting observability and audit. Compile-time foundation: Dagger DI, codegen, config, bootstrap, deploy, JSON profiles. PostgreSQL and Flyway data layer.</desc>
