<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 658" role="img">
<title>Vertique HTTP request lifecycle</title>
<desc>One HTTP request threads ordered middleware: a per-request scope and context stage (open scope, correlation id to MDC, capture origin, register the completion end-handler), then authentication and authorization (resolve identity into SecurityContext, authorize, emit security events), then operation dispatch in the ResourceMethodInvoker (OpenAPI validate, decode body, canonicalize and sanitize, bean validation, invoke the handler), then response negotiation and serialization. Any failure is mapped by an ExceptionMapper to a ProblemDetail. At the end the completion end-handler emits the completion event and an audit record.</desc>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.title{font-size:14px;font-weight:500;}
.sub{font-size:12px;font-weight:400;}
.cap{font-size:12px;font-weight:400;fill:#5F5E5A;}
.arrow{stroke:#888780;stroke-width:1.2;fill:none;}
.dash{stroke:#888780;stroke-width:1.2;fill:none;stroke-dasharray:4 3;}
.fill-gray{fill:#F1EFE8;stroke:#5F5E5A;}.gray-t{fill:#2C2C2A;}.gray-s{fill:#5F5E5A;}
.fill-blue{fill:#E6F1FB;stroke:#185FA5;}.blue-t{fill:#0C447C;}.blue-s{fill:#185FA5;}
.fill-coral{fill:#FAECE7;stroke:#993C1D;}.coral-t{fill:#712B13;}.coral-s{fill:#993C1D;}
.fill-teal{fill:#E1F5EE;stroke:#0F6E56;}.teal-t{fill:#085041;}.teal-s{fill:#0F6E56;}
.fill-amber{fill:#FAEEDA;stroke:#854F0B;}.amber-t{fill:#633806;}.amber-s{fill:#854F0B;}
.fill-pink{fill:#FBEAF0;stroke:#993556;}.pink-t{fill:#72243E;}.pink-s{fill:#993556;}
@media (prefers-color-scheme:dark){
.cap{fill:#B4B2A9;}.arrow{stroke:#888780;}.dash{stroke:#888780;}
.fill-gray{fill:#2C2C2A;stroke:#B4B2A9;}.gray-t{fill:#F1EFE8;}.gray-s{fill:#D3D1C7;}
.fill-blue{fill:#0C447C;stroke:#85B7EB;}.blue-t{fill:#E6F1FB;}.blue-s{fill:#B5D4F4;}
.fill-coral{fill:#712B13;stroke:#F0997B;}.coral-t{fill:#FAECE7;}.coral-s{fill:#F5C4B3;}
.fill-teal{fill:#085041;stroke:#5DCAA5;}.teal-t{fill:#E1F5EE;}.teal-s{fill:#9FE1CB;}
.fill-amber{fill:#633806;stroke:#FAC775;}.amber-t{fill:#FAEEDA;}.amber-s{fill:#FAC775;}
.fill-pink{fill:#72243E;stroke:#ED93B1;}.pink-t{fill:#FBEAF0;}.pink-s{fill:#F4C0D1;}
}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="cap" x="220" y="22" text-anchor="middle">How one HTTP request threads the framework</text>

<g><rect class="fill-gray" x="120" y="34" width="200" height="36" rx="8" stroke-width="0.5"/><text class="title gray-t" x="220" y="52" text-anchor="middle" dominant-baseline="central">HTTP request</text></g>
<line class="arrow" x1="220" y1="70" x2="220" y2="90" marker-end="url(#arrow)"/>

<g><rect class="fill-gray" x="60" y="92" width="320" height="100" rx="8" stroke-width="0.5"/>
<text class="title gray-t" x="220" y="108" text-anchor="middle" dominant-baseline="central">Request scope &amp; context</text>
<text class="sub gray-s" x="76" y="128" dominant-baseline="central">Open per-request scope (holder)</text>
<text class="sub gray-s" x="76" y="146" dominant-baseline="central">Correlation id → MDC + headers</text>
<text class="sub gray-s" x="76" y="164" dominant-baseline="central">Capture request origin (TLS)</text>
<text class="sub gray-s" x="76" y="182" dominant-baseline="central">Register completion end-handler</text>
</g>
<line class="arrow" x1="220" y1="192" x2="220" y2="208" marker-end="url(#arrow)"/>

<g><rect class="fill-coral" x="60" y="208" width="320" height="82" rx="8" stroke-width="0.5"/>
<text class="title coral-t" x="220" y="225" text-anchor="middle" dominant-baseline="central">Authentication &amp; authorization</text>
<text class="sub coral-s" x="76" y="245" dominant-baseline="central">Resolve identity → SecurityContext (p80)</text>
<text class="sub coral-s" x="76" y="263" dominant-baseline="central">Authorize @RolesAllowed / @Authorized (p100)</text>
<text class="sub coral-s" x="76" y="281" dominant-baseline="central">Emit credential + decision events</text>
</g>
<line class="arrow" x1="220" y1="290" x2="220" y2="306" marker-end="url(#arrow)"/>

<g><rect class="fill-teal" x="60" y="306" width="320" height="120" rx="8" stroke-width="0.5"/>
<text class="title teal-t" x="220" y="323" text-anchor="middle" dominant-baseline="central">Operation dispatch — invoker</text>
<text class="sub teal-s" x="76" y="345" dominant-baseline="central">OpenAPI validate (path · query · body)</text>
<text class="sub teal-s" x="76" y="363" dominant-baseline="central">Decode body (RequestBodyDecoder)</text>
<text class="sub teal-s" x="76" y="381" dominant-baseline="central">Canonicalize + sanitize (route→field)</text>
<text class="sub teal-s" x="76" y="399" dominant-baseline="central">Bean Validation</text>
<text class="sub teal-s" x="76" y="417" dominant-baseline="central">Invoke your @Path handler</text>
</g>
<line class="arrow" x1="220" y1="426" x2="220" y2="442" marker-end="url(#arrow)"/>

<g><rect class="fill-blue" x="60" y="442" width="320" height="60" rx="8" stroke-width="0.5"/>
<text class="title blue-t" x="220" y="460" text-anchor="middle" dominant-baseline="central">Response</text>
<text class="sub blue-s" x="220" y="480" text-anchor="middle" dominant-baseline="central">negotiate (Accept) · serialize · 406 if none</text>
</g>
<line class="arrow" x1="220" y1="502" x2="220" y2="518" marker-end="url(#arrow)"/>

<g><rect class="fill-gray" x="120" y="518" width="200" height="36" rx="8" stroke-width="0.5"/><text class="title gray-t" x="220" y="536" text-anchor="middle" dominant-baseline="central">HTTP response</text></g>

<g><rect class="fill-amber" x="430" y="300" width="220" height="104" rx="8" stroke-width="0.5"/>
<text class="title amber-t" x="540" y="318" text-anchor="middle" dominant-baseline="central">Error pipeline</text>
<text class="sub amber-s" x="446" y="338" dominant-baseline="central">Any failure is mapped by</text>
<text class="sub amber-s" x="446" y="356" dominant-baseline="central">ExceptionMapper</text>
<text class="sub amber-s" x="446" y="374" dominant-baseline="central">→ ProblemDetail (RFC 9457)</text>
<text class="sub amber-s" x="446" y="392" dominant-baseline="central">consistent JSON error</text>
</g>
<path class="dash" d="M380 249 L408 249 L408 330 L430 330" marker-end="url(#arrow)"/>
<path class="dash" d="M380 366 L430 366" marker-end="url(#arrow)"/>
<text class="cap" x="392" y="240" dominant-baseline="central">on error</text>
<path class="dash" d="M540 404 L540 472 L382 472" marker-end="url(#arrow)"/>

<line class="arrow" x1="220" y1="554" x2="220" y2="572" marker-end="url(#arrow)"/>
<g><rect class="fill-pink" x="60" y="574" width="590" height="64" rx="8" stroke-width="0.5"/>
<text class="title pink-t" x="355" y="594" text-anchor="middle" dominant-baseline="central">Completion &amp; audit — end handler (fires last)</text>
<text class="sub pink-s" x="355" y="614" text-anchor="middle" dominant-baseline="central">Emits RestRequestCompletedEvent — snapshots SecurityContext + CorrelationContext</text>
<text class="sub pink-s" x="355" y="632" text-anchor="middle" dominant-baseline="central">→ HTTP_SERVER_REQUEST_COMPLETED · optional evidence capture (policy-driven)</text>
</g>
</svg>
