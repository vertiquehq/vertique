<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 820 592" role="img">
<title>Vertique Services runtime architecture</title>
<desc>Typed service clients and framework integrations target service operations. Typed clients call through contract metadata while Kafka, cron jobs, delayed jobs, workflow, and inbox and outbox use stable operation identities. Dispatch sends requests over the Vert.x event bus to Vertique Services below it. Services restores context, applies policies, and distributes work across independently configured service verticle instances. Instances have separate contexts and consumers but share the selected implementation object. Results return through the event bus.</desc>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.title{font-size:14px;font-weight:500;}.sub{font-size:12px;font-weight:400;}.cap{font-size:12px;font-weight:400;fill:#5F5E5A;}.arrow{stroke:#888780;stroke-width:1.2;fill:none;}
.fill-gray{fill:#F1EFE8;stroke:#5F5E5A;}.gray-t{fill:#2C2C2A;}.gray-s{fill:#5F5E5A;}
.fill-teal{fill:#E1F5EE;stroke:#0F6E56;}.teal-t{fill:#085041;}.teal-s{fill:#0F6E56;}
.fill-purple{fill:#EEEDFE;stroke:#534AB7;}.purple-t{fill:#3C3489;}.purple-s{fill:#534AB7;}
@media (prefers-color-scheme:dark){
.cap{fill:#B4B2A9;}.arrow{stroke:#888780;}
.fill-gray{fill:#2C2C2A;stroke:#B4B2A9;}.gray-t{fill:#F1EFE8;}.gray-s{fill:#D3D1C7;}
.fill-teal{fill:#085041;stroke:#5DCAA5;}.teal-t{fill:#E1F5EE;}.teal-s{fill:#9FE1CB;}
.fill-purple{fill:#3C3489;stroke:#AFA9EC;}.purple-t{fill:#EEEDFE;}.purple-s{fill:#CECBF6;}
}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

