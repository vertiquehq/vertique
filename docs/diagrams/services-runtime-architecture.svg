<text class="sub teal-s" x="410" y="360" text-anchor="middle" dominant-baseline="central">restore context · authorize · resilience · failure transport · observability</text>
<text class="sub teal-s" x="410" y="377" text-anchor="middle" dominant-baseline="central">lifecycle · readiness · supervision</text></g>

