<text class="sub gray-s" x="168" y="476" text-anchor="middle" dominant-baseline="central">one Vert.x context</text>
<text class="sub gray-s" x="168" y="494" text-anchor="middle" dominant-baseline="central">consumer per operation</text></g>

<g><rect class="fill-gray" x="300" y="430" width="220" height="82" rx="8" stroke-width="0.5"/>
