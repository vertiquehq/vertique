<g><rect class="fill-teal" x="415" y="42" width="118" height="52" rx="8" stroke-width="0.5"/><text class="title teal-t" x="474" y="68" text-anchor="middle" dominant-baseline="central">Delayed jobs</text></g>
<g><rect class="fill-teal" x="544" y="42" width="118" height="52" rx="8" stroke-width="0.5"/><text class="title teal-t" x="603" y="68" text-anchor="middle" dominant-baseline="central">Workflow</text></g>
<g><rect class="fill-teal" x="673" y="42" width="118" height="52" rx="8" stroke-width="0.5"/><text class="title teal-t" x="732" y="68" text-anchor="middle" dominant-baseline="central">Inbox/Outbox</text></g>

