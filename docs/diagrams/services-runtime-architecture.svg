<text class="cap" x="410" y="538" text-anchor="middle">Vert.x distributes calls across consumers registered at the same operation address</text>
<text class="cap" x="410" y="558" text-anchor="middle">Contract identity remains stable while deployment instance counts change</text>
<text class="cap" x="410" y="578" text-anchor="middle">Contexts and consumers scale; the selected implementation object is shared</text>
</svg>
