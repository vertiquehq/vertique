<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 820 484" role="img">
<title>Vertique application startup lifecycle</title>
<desc>VertiqueApplication, the launcher and every generated application's Main-Class, resolves bootstrap configuration on a temporary Vert.x instance, builds the real Vertx instance through the VertxBuilderContributor chain, and discovers the application's component factory via ServiceLoader. It hands the component to the lifecycle runner, VertiqueApplicationBootstrap, which drives eight ordered phases: CONFIGURE, VALIDATE, and MIGRATE run startup steps only; BOOTSTRAP, INFRA, SERVICES, and EDGE also deploy that phase's verticles; AFTER_START runs post-start steps. In the generated REST application, Flyway schema migrations from the PostgreSQL starter land in MIGRATE, the management verticle lands in INFRA so the health surface is up first, and the http verticle lands in EDGE so traffic is served only at the end. A bootstrap-configuration failure exits with code 11; a verticle deploy failure exits with code 15.</desc>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.title{font-size:14px;font-weight:500;}
.sub{font-size:12px;font-weight:400;}
.cap{font-size:12px;font-weight:400;fill:#5F5E5A;}
.phase{font-size:11.5px;font-weight:500;}
.arrow{stroke:#888780;stroke-width:1.2;fill:none;}
.fill-gray{fill:#F1EFE8;stroke:#5F5E5A;}.gray-t{fill:#2C2C2A;}.gray-s{fill:#5F5E5A;}
.fill-blue{fill:#E6F1FB;stroke:#185FA5;}.blue-t{fill:#0C447C;}.blue-s{fill:#185FA5;}
.fill-coral{fill:#FAECE7;stroke:#993C1D;}.coral-t{fill:#712B13;}.coral-s{fill:#993C1D;}
.fill-teal{fill:#E1F5EE;stroke:#0F6E56;}.teal-t{fill:#085041;}.teal-s{fill:#0F6E56;}
@media (prefers-color-scheme:dark){
.cap{fill:#B4B2A9;}.arrow{stroke:#888780;}
.fill-gray{fill:#2C2C2A;stroke:#B4B2A9;}.gray-t{fill:#F1EFE8;}.gray-s{fill:#D3D1C7;}
.fill-blue{fill:#0C447C;stroke:#85B7EB;}.blue-t{fill:#E6F1FB;}.blue-s{fill:#B5D4F4;}
.fill-coral{fill:#712B13;stroke:#F0997B;}.coral-t{fill:#FAECE7;}.coral-s{fill:#F5C4B3;}
.fill-teal{fill:#085041;stroke:#5DCAA5;}.teal-t{fill:#E1F5EE;}.teal-s{fill:#9FE1CB;}
}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="cap" x="410" y="24" text-anchor="middle">One ordered path from process start to serving traffic</text>

<g><rect class="fill-coral" x="42" y="40" width="736" height="98" rx="10" stroke-width="0.8"/>
<text class="title coral-t" x="410" y="62" text-anchor="middle" dominant-baseline="central">VertiqueApplication — the launcher, every generated application's Main-Class</text>
<text class="sub coral-s" x="410" y="84" text-anchor="middle" dominant-baseline="central">1 · resolve bootstrap configuration on a temporary Vert.x instance</text>
<text class="sub coral-s" x="410" y="101" text-anchor="middle" dominant-baseline="central">2 · build the real Vertx instance — VertxBuilderContributor chain</text>
<text class="sub coral-s" x="410" y="118" text-anchor="middle" dominant-baseline="central">3 · discover your application's component factory via ServiceLoader</text></g>

<line class="arrow" x1="410" y1="138" x2="410" y2="166" marker-end="url(#arrow)"/>
<text class="cap" x="422" y="152" dominant-baseline="central">hands your component to the runner</text>

<g><rect class="fill-teal" x="42" y="168" width="736" height="62" rx="10" stroke-width="0.8"/>
<text class="title teal-t" x="410" y="190" text-anchor="middle" dominant-baseline="central">VertiqueApplicationBootstrap — the lifecycle runner</text>
<text class="sub teal-s" x="410" y="212" text-anchor="middle" dominant-baseline="central">for each phase, in order: run its startup steps, then deploy its verticles</text></g>

<line class="arrow" x1="410" y1="230" x2="410" y2="256" marker-end="url(#arrow)"/>

<text class="cap" x="176" y="272" text-anchor="middle">startup steps only</text>
<text class="cap" x="501" y="272" text-anchor="middle">startup steps + verticle deployments</text>
<text class="cap" x="734" y="272" text-anchor="middle">post-start</text>

<line class="arrow" x1="50" y1="308" x2="794" y2="308" marker-end="url(#arrow)"/>

<g><rect class="fill-gray" x="42" y="290" width="82" height="36" rx="6" stroke-width="0.5"/>
<text class="phase gray-t" x="83" y="308" text-anchor="middle" dominant-baseline="central">CONFIGURE</text></g>
<g><rect class="fill-gray" x="135" y="290" width="82" height="36" rx="6" stroke-width="0.5"/>
<text class="phase gray-t" x="176" y="308" text-anchor="middle" dominant-baseline="central">VALIDATE</text></g>
<g><rect class="fill-gray" x="228" y="290" width="82" height="36" rx="6" stroke-width="0.5"/>
<text class="phase gray-t" x="269" y="308" text-anchor="middle" dominant-baseline="central">MIGRATE</text></g>
<g><rect class="fill-teal" x="321" y="290" width="82" height="36" rx="6" stroke-width="0.5"/>
<text class="phase teal-t" x="362" y="308" text-anchor="middle" dominant-baseline="central">BOOTSTRAP</text></g>
<g><rect class="fill-teal" x="414" y="290" width="82" height="36" rx="6" stroke-width="0.5"/>
<text class="phase teal-t" x="455" y="308" text-anchor="middle" dominant-baseline="central">INFRA</text></g>
<g><rect class="fill-teal" x="507" y="290" width="82" height="36" rx="6" stroke-width="0.5"/>
<text class="phase teal-t" x="548" y="308" text-anchor="middle" dominant-baseline="central">SERVICES</text></g>
<g><rect class="fill-teal" x="600" y="290" width="82" height="36" rx="6" stroke-width="0.5"/>
<text class="phase teal-t" x="641" y="308" text-anchor="middle" dominant-baseline="central">EDGE</text></g>
<g><rect class="fill-gray" x="693" y="290" width="82" height="36" rx="6" stroke-width="0.5"/>
<text class="phase gray-t" x="734" y="308" text-anchor="middle" dominant-baseline="central">AFTER_START</text></g>

<path class="arrow" d="M269 326 L154 346" marker-end="url(#arrow)"/>
<path class="arrow" d="M455 326 L410 346" marker-end="url(#arrow)"/>
<path class="arrow" d="M641 326 L665 346" marker-end="url(#arrow)"/>

<g><rect class="fill-blue" x="42" y="348" width="225" height="58" rx="8" stroke-width="0.5"/>
<text class="title blue-t" x="154" y="369" text-anchor="middle" dominant-baseline="central">Flyway schema migrations</text>
<text class="sub blue-s" x="154" y="389" text-anchor="middle" dominant-baseline="central">from vertique-starter-postgresql</text></g>

<g><rect class="fill-gray" x="298" y="348" width="225" height="58" rx="8" stroke-width="0.5"/>
<text class="title gray-t" x="410" y="369" text-anchor="middle" dominant-baseline="central">management verticle</text>
<text class="sub gray-s" x="410" y="389" text-anchor="middle" dominant-baseline="central">health surface up first</text></g>

<g><rect class="fill-gray" x="553" y="348" width="225" height="58" rx="8" stroke-width="0.5"/>
<text class="title gray-t" x="665" y="369" text-anchor="middle" dominant-baseline="central">http verticle</text>
<text class="sub gray-s" x="665" y="389" text-anchor="middle" dominant-baseline="central">serves traffic only at the end</text></g>

<text class="cap" x="410" y="440" text-anchor="middle">Only BOOTSTRAP · INFRA · SERVICES · EDGE may carry verticle deployments</text>
<text class="cap" x="410" y="462" text-anchor="middle">Exit codes: bootstrap-configuration failure → 11 · verticle deploy failure → 15</text>
</svg>
