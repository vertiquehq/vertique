<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 516" role="img">
<title>Vertique durable execution core</title>
<desc>A Temporal-style durable workflow loop: inbound signals are deduplicated by the inbox, the workflow engine computes a transition and commits workflow state plus recorded outbox side-effects together in one Postgres transaction, then after commit the outbox relay delivers those side-effects to services, delayed jobs, Kafka and Camel; timers and scheduled transitions re-enter via the inbox.</desc>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.title{font-size:14px;font-weight:500;}
.sub{font-size:12px;font-weight:400;}
.cap{font-size:12px;font-weight:400;fill:#5F5E5A;}
.fill-gray{fill:#F1EFE8;stroke:#5F5E5A;}.gray-t{fill:#2C2C2A;}.gray-s{fill:#5F5E5A;}
.fill-blue{fill:#E6F1FB;stroke:#185FA5;}.blue-t{fill:#0C447C;}.blue-s{fill:#185FA5;}
.fill-teal{fill:#E1F5EE;stroke:#0F6E56;}.teal-t{fill:#085041;}.teal-s{fill:#0F6E56;}
.fill-purple{fill:#EEEDFE;stroke:#534AB7;}.purple-t{fill:#3C3489;}.purple-s{fill:#534AB7;}
@media (prefers-color-scheme:dark){
.cap{fill:#B4B2A9;}
.fill-gray{fill:#2C2C2A;stroke:#B4B2A9;}.gray-t{fill:#F1EFE8;}.gray-s{fill:#D3D1C7;}
.fill-blue{fill:#0C447C;stroke:#85B7EB;}.blue-t{fill:#E6F1FB;}.blue-s{fill:#B5D4F4;}
.fill-teal{fill:#085041;stroke:#5DCAA5;}.teal-t{fill:#E1F5EE;}.teal-s{fill:#9FE1CB;}
.fill-purple{fill:#3C3489;stroke:#AFA9EC;}.purple-t{fill:#EEEDFE;}.purple-s{fill:#CECBF6;}
}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g><rect class="fill-gray" x="170" y="34" width="340" height="52" rx="8" stroke-width="0.5"/><text class="title gray-t" x="340" y="55" text-anchor="middle" dominant-baseline="central">Inbound — signals, messages, replies</text><text class="sub gray-s" x="340" y="72" text-anchor="middle" dominant-baseline="central">deduplicated by the inbox · exactly-once</text></g>

<line x1="340" y1="88" x2="340" y2="108" stroke="#888780" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

<g><rect class="fill-teal" x="110" y="110" width="460" height="56" rx="8" stroke-width="0.5"/><text class="title teal-t" x="340" y="130" text-anchor="middle" dominant-baseline="central">Durable workflow engine</text><text class="sub teal-s" x="340" y="148" text-anchor="middle" dominant-baseline="central">code-first DSL · versioned plans · snapshot + history</text></g>

<line x1="340" y1="166" x2="340" y2="188" stroke="#1D9E75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

<rect class="fill-gray" x="70" y="190" width="540" height="104" rx="14" stroke-width="0.5"/>
<text class="title gray-t" x="84" y="210" dominant-baseline="central">Atomic commit — one Postgres transaction</text>
<g><rect class="fill-teal" x="88" y="224" width="246" height="60" rx="8" stroke-width="0.5"/><text class="title teal-t" x="211" y="246" text-anchor="middle" dominant-baseline="central">Workflow state + history</text><text class="sub teal-s" x="211" y="266" text-anchor="middle" dominant-baseline="central">snapshot · optimistic concurrency</text></g>
<g><rect class="fill-purple" x="346" y="224" width="246" height="60" rx="8" stroke-width="0.5"/><text class="title purple-t" x="469" y="246" text-anchor="middle" dominant-baseline="central">Outbox — side-effects</text><text class="sub purple-s" x="469" y="266" text-anchor="middle" dominant-baseline="central">no live dispatch in transition</text></g>

<line x1="340" y1="294" x2="340" y2="328" stroke="#7F77DD" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
<text class="cap" x="350" y="312" dominant-baseline="central">after commit</text>

<g><rect class="fill-purple" x="200" y="330" width="280" height="52" rx="8" stroke-width="0.5"/><text class="title purple-t" x="340" y="349" text-anchor="middle" dominant-baseline="central">Outbox relay</text><text class="sub purple-s" x="340" y="366" text-anchor="middle" dominant-baseline="central">poll + LISTEN/NOTIFY · at-least-once</text></g>

<path d="M340 384 L340 398 L109 398 L109 408" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M340 384 L340 398 L263 398 L263 408" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M340 384 L340 398 L417 398 L417 408" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M340 384 L340 398 L571 398 L571 408" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>

<g><rect class="fill-blue" x="40" y="410" width="138" height="52" rx="8" stroke-width="0.5"/><text class="title blue-t" x="109" y="429" text-anchor="middle" dominant-baseline="central">Services</text><text class="sub blue-s" x="109" y="446" text-anchor="middle" dominant-baseline="central">event bus</text></g>
<g><rect class="fill-blue" x="194" y="410" width="138" height="52" rx="8" stroke-width="0.5"/><text class="title blue-t" x="263" y="429" text-anchor="middle" dominant-baseline="central">Delayed jobs</text><text class="sub blue-s" x="263" y="446" text-anchor="middle" dominant-baseline="central">timers + retries</text></g>
<g><rect class="fill-blue" x="348" y="410" width="138" height="52" rx="8" stroke-width="0.5"/><text class="title blue-t" x="417" y="429" text-anchor="middle" dominant-baseline="central">Kafka</text><text class="sub blue-s" x="417" y="446" text-anchor="middle" dominant-baseline="central">topics</text></g>
<g><rect class="fill-blue" x="502" y="410" width="138" height="52" rx="8" stroke-width="0.5"/><text class="title blue-t" x="571" y="429" text-anchor="middle" dominant-baseline="central">Camel</text><text class="sub blue-s" x="571" y="446" text-anchor="middle" dominant-baseline="central">300+ endpoints</text></g>

<text class="cap" x="340" y="478" text-anchor="middle" dominant-baseline="central">↻ timers &amp; scheduled transitions re-enter via the inbox</text>

<rect x="40" y="494" width="12" height="12" rx="3" fill="#888780"/><text class="cap" x="58" y="500" dominant-baseline="central">transaction boundary</text>
<rect x="196" y="494" width="12" height="12" rx="3" fill="#1D9E75"/><text class="cap" x="214" y="500" dominant-baseline="central">durable workflow</text>
<rect x="330" y="494" width="12" height="12" rx="3" fill="#7F77DD"/><text class="cap" x="348" y="500" dominant-baseline="central">transactional messaging</text>
<rect x="505" y="494" width="12" height="12" rx="3" fill="#185FA5"/><text class="cap" x="523" y="500" dominant-baseline="central">delivery targets</text>
</svg>
