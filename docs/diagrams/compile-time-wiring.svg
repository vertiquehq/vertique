<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 544" role="img">
<title>Vertique compile-time wiring</title>
<desc>You write typed contracts as annotations; at mvn compile the vertique-codegen annotation processors generate Dagger bindings, typed proxies, JAX-RS descriptors and Kafka metadata, and run build-time validation that fails the compile on invalid cron expressions, security-annotation conflicts, RolesAllowed and Path/PathParam mismatches. Dagger then assembles a compile-time DI component, so the running application uses no reflection or classpath scanning.</desc>
<defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.title{font-size:14px;font-weight:500;}
.sub{font-size:12px;font-weight:400;}
.cap{font-size:12px;font-weight:400;fill:#5F5E5A;}
.arrow{stroke:#888780;stroke-width:1.2;fill:none;}
.fill-gray{fill:#F1EFE8;stroke:#5F5E5A;}.gray-t{fill:#2C2C2A;}.gray-s{fill:#5F5E5A;}
.fill-teal{fill:#E1F5EE;stroke:#0F6E56;}.teal-t{fill:#085041;}.teal-s{fill:#0F6E56;}
.fill-coral{fill:#FAECE7;stroke:#993C1D;}.coral-t{fill:#712B13;}.coral-s{fill:#993C1D;}
.fill-purple{fill:#EEEDFE;stroke:#534AB7;}.purple-t{fill:#3C3489;}.purple-s{fill:#534AB7;}
@media (prefers-color-scheme:dark){
.cap{fill:#B4B2A9;}.arrow{stroke:#888780;}
.fill-gray{fill:#2C2C2A;stroke:#B4B2A9;}.gray-t{fill:#F1EFE8;}.gray-s{fill:#D3D1C7;}
.fill-teal{fill:#085041;stroke:#5DCAA5;}.teal-t{fill:#E1F5EE;}.teal-s{fill:#9FE1CB;}
.fill-coral{fill:#712B13;stroke:#F0997B;}.coral-t{fill:#FAECE7;}.coral-s{fill:#F5C4B3;}
.fill-purple{fill:#3C3489;stroke:#AFA9EC;}.purple-t{fill:#EEEDFE;}.purple-s{fill:#CECBF6;}
}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="cap" x="340" y="26" text-anchor="middle">You write typed contracts; the build writes the plumbing</text>

<g><rect class="fill-gray" x="70" y="40" width="540" height="80" rx="10" stroke-width="0.5"/><text class="title gray-t" x="340" y="60" text-anchor="middle" dominant-baseline="central">You write — annotated contracts</text><text class="sub gray-s" x="340" y="84" text-anchor="middle" dominant-baseline="central">@Path · @ServiceContract · @RestClient · @KafkaListener</text><text class="sub gray-s" x="340" y="102" text-anchor="middle" dominant-baseline="central">@CronJob · @DelayedJobContract · @WorkflowContract · @Sanitize</text></g>

<line class="arrow" x1="340" y1="120" x2="340" y2="140" marker-end="url(#arrow)"/>
<text class="cap" x="350" y="131" dominant-baseline="central">mvn compile</text>

<g><rect class="fill-gray" x="120" y="142" width="440" height="52" rx="8" stroke-width="0.5"/><text class="title gray-t" x="340" y="162" text-anchor="middle" dominant-baseline="central">Annotation processors</text><text class="sub gray-s" x="340" y="180" text-anchor="middle" dominant-baseline="central">vertique-codegen-* · run during the build</text></g>

<path class="arrow" d="M340 194 L340 206 L190 206 L190 216" marker-end="url(#arrow)"/>
<path class="arrow" d="M340 194 L340 206 L500 206 L500 216" marker-end="url(#arrow)"/>

<g><rect class="fill-teal" x="40" y="216" width="300" height="156" rx="8" stroke-width="0.5"/>
<text class="title teal-t" x="190" y="236" text-anchor="middle" dominant-baseline="central">Generated code</text>
<text class="sub teal-s" x="56" y="258" dominant-baseline="central">Dagger @Module bindings</text>
<text class="sub teal-s" x="56" y="278" dominant-baseline="central">Typed REST / Kafka / job proxies</text>
<text class="sub teal-s" x="56" y="298" dominant-baseline="central">Workflow client proxies</text>
<text class="sub teal-s" x="56" y="318" dominant-baseline="central">Service contract contributors</text>
<text class="sub teal-s" x="56" y="338" dominant-baseline="central">JAX-RS descriptors + execution plans</text>
<text class="sub teal-s" x="56" y="358" dominant-baseline="central">Kafka meta · DTO input processors</text>
</g>

<g><rect class="fill-coral" x="360" y="216" width="280" height="156" rx="8" stroke-width="0.5"/>
<text class="title coral-t" x="500" y="236" text-anchor="middle" dominant-baseline="central">Build-time validation</text>
<text class="sub coral-s" x="376" y="258" dominant-baseline="central">Invalid cron expressions</text>
<text class="sub coral-s" x="376" y="278" dominant-baseline="central">Security-annotation conflicts</text>
<text class="sub coral-s" x="376" y="298" dominant-baseline="central">Empty @RolesAllowed</text>
<text class="sub coral-s" x="376" y="318" dominant-baseline="central">@Path / @PathParam mismatch</text>
<text class="sub coral-s" x="376" y="338" dominant-baseline="central">Body/form &amp; verb conflicts</text>
<text class="title coral-t" x="376" y="360" dominant-baseline="central">→ fails mvn compile</text>
</g>

<path class="arrow" d="M190 372 L190 384 L340 384 L340 394" marker-end="url(#arrow)"/>

<g><rect class="fill-gray" x="120" y="394" width="440" height="52" rx="8" stroke-width="0.5"/><text class="title gray-t" x="340" y="414" text-anchor="middle" dominant-baseline="central">Dagger @Component</text><text class="sub gray-s" x="340" y="432" text-anchor="middle" dominant-baseline="central">compile-time DI graph — wired, not scanned</text></g>

<line class="arrow" x1="340" y1="446" x2="340" y2="464" marker-end="url(#arrow)"/>

<g><rect class="fill-purple" x="120" y="466" width="440" height="58" rx="8" stroke-width="0.5"/><text class="title purple-t" x="340" y="486" text-anchor="middle" dominant-baseline="central">Running application</text><text class="sub purple-s" x="340" y="506" text-anchor="middle" dominant-baseline="central">no reflection · no classpath scan · pure wiring · fast boot</text></g>
</svg>
