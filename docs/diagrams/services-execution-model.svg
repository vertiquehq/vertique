<text class="sub purple-s" x="410" y="397" text-anchor="middle" dominant-baseline="central">addressed delivery · async request/reply</text></g>

<line class="arrow" x1="410" y1="412" x2="410" y2="440" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="cap" x="422" y="427" dominant-baseline="central">request · result</text>

