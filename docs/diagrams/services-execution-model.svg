<text class="title gray-t" x="195" y="64" text-anchor="middle" dominant-baseline="central">Application code</text>
<text class="sub gray-s" x="195" y="84" text-anchor="middle" dominant-baseline="central">inject the contract · call an interface method</text></g>

<g><rect class="fill-blue" x="472" y="42" width="306" height="62" rx="8" stroke-width="0.5"/>
<text class="title blue-t" x="625" y="64" text-anchor="middle" dominant-baseline="central">Framework integrations</text>
<text class="sub blue-s" x="625" y="84" text-anchor="middle" dominant-baseline="central">Kafka · cron · delayed jobs · workflow · outbox</text></g>

