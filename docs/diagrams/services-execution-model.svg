<text class="title coral-t" x="410" y="464" text-anchor="middle" dominant-baseline="central">Services — managed contract execution</text>
<text class="sub coral-s" x="410" y="485" text-anchor="middle" dominant-baseline="central">restore context · authorize · apply resilience · transport failures · observe</text>
<text class="sub coral-s" x="410" y="502" text-anchor="middle" dominant-baseline="central">deployment lifecycle · readiness · supervision</text></g>

