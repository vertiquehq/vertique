<text class="sub teal-s" x="410" y="297" text-anchor="middle" dominant-baseline="central">resolve operation · capture registered context · build DispatchEnvelope</text>
<text class="sub teal-s" x="410" y="314" text-anchor="middle" dominant-baseline="central">runtime address: services/{namespace}/{service}/{operation}</text></g>

<line class="arrow" x1="410" y1="328" x2="410" y2="356" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="cap" x="422" y="343" dominant-baseline="central">request · result</text>

