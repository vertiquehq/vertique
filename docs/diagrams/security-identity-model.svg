</g>
<g><rect class="fill-blue" x="54" y="234" width="98" height="64" rx="6" stroke-width="0.5"/><text class="title blue-t" x="103" y="256" text-anchor="middle" dominant-baseline="central">Identity</text><text class="sub blue-s" x="103" y="276" text-anchor="middle" dominant-baseline="central">actor·subject</text></g>
<g><rect class="fill-blue" x="162" y="234" width="98" height="64" rx="6" stroke-width="0.5"/><text class="title blue-t" x="211" y="256" text-anchor="middle" dominant-baseline="central">Auth state</text><text class="sub blue-s" x="211" y="276" text-anchor="middle" dominant-baseline="central">method·evidence</text></g>
<g><rect class="fill-blue" x="270" y="234" width="98" height="64" rx="6" stroke-width="0.5"/><text class="title blue-t" x="319" y="256" text-anchor="middle" dominant-baseline="central">Claims</text><text class="sub blue-s" x="319" y="276" text-anchor="middle" dominant-baseline="central">roles·scopes</text></g>
<g><rect class="fill-blue" x="378" y="234" width="98" height="64" rx="6" stroke-width="0.5"/><text class="title blue-t" x="427" y="256" text-anchor="middle" dominant-baseline="central">Origin</text><text class="sub blue-s" x="427" y="276" text-anchor="middle" dominant-baseline="central">TLS facts</text></g>
<line class="arrow" x1="265" y1="318" x2="265" y2="340" marker-end="url(#arrow)"/>

<g><rect class="fill-purple" x="40" y="340" width="450" height="56" rx="8" stroke-width="0.5"/><text class="title purple-t" x="265" y="360" text-anchor="middle" dominant-baseline="central">One context, every surface</text><text class="sub purple-s" x="265" y="380" text-anchor="middle" dominant-baseline="central">REST · Services · Jobs · Workflow · WebSocket/SSE</text></g>
<line class="arrow" x1="265" y1="396" x2="265" y2="416" marker-end="url(#arrow)"/>

<g><rect class="fill-gray" x="90" y="416" width="350" height="58" rx="8" stroke-width="0.5"/><text class="title gray-t" x="265" y="436" text-anchor="middle" dominant-baseline="central">Authorization = per-call decision</text><text class="sub gray-s" x="265" y="456" text-anchor="middle" dominant-baseline="central">allow / deny per call — never ambient state</text></g>

<g><rect class="fill-pink" x="510" y="110" width="140" height="294" rx="8" stroke-width="0.5"/>
<text class="title pink-t" x="580" y="128" text-anchor="middle" dominant-baseline="central">Security events</text>
<text class="sub pink-s" x="580" y="146" text-anchor="middle" dominant-baseline="central">→ observers</text>
<text class="sub pink-s" x="522" y="180" dominant-baseline="central">credential accepted</text>
<text class="sub pink-s" x="522" y="202" dominant-baseline="central">credential rejected</text>
<text class="sub pink-s" x="522" y="224" dominant-baseline="central">authz decision</text>
<text class="sub pink-s" x="522" y="246" dominant-baseline="central">channel lifecycle</text>
<text class="title pink-t" x="522" y="280" dominant-baseline="central">→ audit · metrics</text>
</g>
<path class="dash" d="M490 148 L510 148" marker-end="url(#arrow)"/>
<path class="dash" d="M440 445 L500 445 L500 380 L510 380" marker-end="url(#arrow)"/>

<g><rect class="fill-amber" x="40" y="492" width="610" height="56" rx="8" stroke-width="0.5"/><text class="title amber-t" x="345" y="510" text-anchor="middle" dominant-baseline="central">Boundary — verifies credentials, is not an identity provider</text><text class="sub amber-s" x="345" y="530" text-anchor="middle" dominant-baseline="central">no user store · no passwords · no login / SAML flows · no server sessions (ADR-0063)</text></g>
</svg>
